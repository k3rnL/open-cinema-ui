name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Verify workspace version identity
        run: npm run version:check

      - name: Build shared package
        run: npm run build:shared

      - name: Type check all workspaces
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run all unit tests
        run: npm test

      - name: Build both production applications
        run: npm run build

      - name: Verify production version metadata and contract asset
        run: npm run version:check -- --dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded release browser smoke
        run: npm run test:e2e:release
