name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Gate and package tag
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Reject tag/version disagreement
        run: npm run version:check -- --tag "${GITHUB_REF_NAME}"

      - name: Build shared package
        run: npm run build:shared

      - name: Type check all workspaces
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run all unit tests
        run: npm test

      - name: Build both production applications
        run: npm run build

      - name: Verify production version metadata and contract asset
        run: npm run version:check -- --tag "${GITHUB_REF_NAME}" --dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded release browser smoke
        run: npm run test:e2e:release

      - name: Create separate archives, checksums, and portable provenance
        run: >-
          npm run release:package --
          --tag "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}"
          --repository "${GITHUB_REPOSITORY}"
          --workflow-run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify packaged bytes before upload
        run: |
          npm run version:check -- --tag "${GITHUB_REF_NAME}" --dist --artifacts release-dist
          npm run release:verify -- --input release-dist --tag "${GITHUB_REF_NAME}" --smoke

      - name: Upload release assets for isolated verification
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-dist/*
          if-no-files-found: error

  release:
    name: Verify download and publish
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: downloaded-release

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify downloaded archives and served applications
        run: npm run release:verify -- --input downloaded-release --tag "${GITHUB_REF_NAME}" --smoke

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: release_notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release and upload verified assets
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: downloaded-release/*
